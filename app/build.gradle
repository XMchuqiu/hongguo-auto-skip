plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hongguo.auto'
    compileSdk 34

    // 使用项目内自带的调试签名，避免依赖 ~/.android/debug.keystore（CI / 受限环境更稳）
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.hongguo.auto"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.3"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}


